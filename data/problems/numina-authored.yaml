# Lời giải từng bước viết trực tiếp cho một số bài số học NuminaMath (chỉ nguồn bài lời văn gsm8k)
# mà cách tách bước từ CoT (derived_from_cot) không dùng được (thiếu mắt xích, không ra đáp án, không có
# phép tính kiểm được, quá ít bước). Chỉ là phương án dự phòng thiểu số; KHÔNG dùng cho bài bị loại vì làm
# tròn hay bài số học từ nguồn math/synthetic_math.
# Đề và đáp án lấy nguyên từ ứng viên NuminaMath (numina_row); chỉ phần `steps` được viết thêm.
# Mỗi đáp án của tập dữ liệu đã được đọc lại và kiểm tay trước khi viết; bài có đề mơ hồ bị bỏ qua.
# scripts/write-step-solutions.py chỉ áp dụng khi cách tách từ CoT thất bại. Mọi bước vẫn phải qua
# math_check.arith_step, bước cuối bằng đáp án, và các bộ lọc chuỗi của solution_writer.check_arith_chain:
# không bước đồng nhất (0 + a, a * 1, 1 ^ n, ...), ít nhất 2 bước, kết quả trung gian nào cũng được dùng,
# số liệu nào của đề (trừ 0 và 1) cũng được dùng. Misconception sinh tự động như các bài khác.
# Kho v2 bỏ 5 mục của bản v1: 118354 và 126651 (giờ tách được từ CoT), 96264 (có bước đồng nhất 1 * 8 = 8),
# 114648 và 124200 (số "2" của "2nd-grade"/"Period 2" là nhãn, bộ lọc số liệu coi là số liệu chưa dùng);
# mục 15764 viết rõ bước 2 + 0.5 = 2.5, mục 121431 viết rõ hỗn số 1 1/4 = 1 + 1/4.
