[project]
name = "nhom8-ai-math-tutor"
version = "0.1.0"
description = "INT4418 Nhóm 8 — AI Math Tutor: luồng sự kiện học tập, trạng thái người học thời gian thực, gợi ý toán có kiểm chứng"
requires-python = ">=3.10"
dependencies = [
    "jsonschema[format-nongpl]>=4.21",
    "sympy>=1.12",
    # Streaming và dữ liệu
    "pyspark==4.1.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "protobuf>=5",
    "confluent-kafka==2.16.0",
    "redis>=5",
    # Hạ tầng, cấu hình, theo dõi tài nguyên, tải dữ liệu
    "pyyaml>=6",
    "psutil>=6",
    "requests>=2.32",
    # Dịch vụ gợi ý và dashboard
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
    # Đánh giá và hình
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "fakeredis>=2.26", "httpx>=0.27", "locust>=2.32"]
# Sinh tài liệu .docx và .pptx; không cần cho pipeline hay thí nghiệm.
report = ["python-docx>=1.2", "python-pptx>=1.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_math_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: cần Docker (Kafka/Redis) hoặc Spark; chạy bằng -m integration"]
