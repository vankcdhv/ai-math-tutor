# Hạ tầng phát triển/thí nghiệm: Kafka (KRaft, một node) + Redis.
# Ứng dụng (Spark, FastAPI, Streamlit) chạy trên host và nối qua 127.0.0.1;
# container khác trong cùng mạng Compose nối Kafka qua kafka:29092.
# Mọi cổng chỉ publish trên 127.0.0.1 — tests/test_compose_bindings.py kiểm tự động.
# Image ghim theo digest (tag để đọc, digest để tái lập). Cập nhật: docker pull <tag>
# rồi docker inspect --format '{{index .RepoDigests 0}}' <tag>.

name: nhom8

services:
  kafka:
    # apache/kafka:4.3.2 (image tạo 2026-10-11)
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # Đặt bất kỳ biến KAFKA_* nào sẽ tắt toàn bộ cấu hình mặc định của image → khai báo đủ.
      # UUID base64 sinh một lần bằng kafka-storage.sh random-uuid; cố định để volume dùng lại được.
      CLUSTER_ID: "wtPPUfMFTyuAJIGdXLxKSg"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Listener kép: INTERNAL cho container cùng mạng, EXTERNAL cho client trên host.
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      # Topic chỉ được tạo tường minh (số partition là tham số thí nghiệm). Nếu bật, client còn
      # sót metadata (ví dụ Spark lúc stop) sẽ tạo lại topic vừa xóa — đã quan sát trong spike.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Log một run đỉnh ~2,4 GB; giữ 24 h là đủ cho đối soát, runner xóa topic sau run.
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      # Named volume nằm trong data-root của Docker Engine (ext4 của WSL/SSD), không trên /mnt/*.
      - kafka-data:/var/lib/kafka/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    # redis:8.10.2-alpine (phát hành 2026-09-17; ≥ 2 tuần tuổi). Bản vá 8.10.3 (2026-10-26)
    # chỉ sửa lỗi cluster bus — không áp dụng cho Redis một node.
    image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Mật khẩu đi qua biến môi trường, không nằm trong dòng lệnh tiến trình.
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Đặt REDIS_PASSWORD trong .env (xem .env.example)}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Đặt REDIS_PASSWORD trong .env (xem .env.example)}"
    # Trạng thái Redis là bản sao dẫn xuất từ luồng → không lưu đĩa (--save "", không AOF).
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
        --maxmemory 768mb --maxmemory-policy noeviction
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kafka-data:
